[tox]
# Static PR gates for the mcp plugin.
#
# Each env runs in its own throwaway virtualenv that tox builds from the deps
# declared in that env, never with system site-packages, so nothing is borrowed
# from the server's runtime environment. `rm -rf .tox` forces a clean rebuild.
# No tox? tools/run-pr-gates.sh stands the same gates up from a bare python.
#
# The pytest suite is not here: it imports the caldera core and the full
# dependency set and runs from a caldera checkout (see README).
envlist = hub-agnostic, bandit
skipsdist = true

# Plugin-agnosticism: this plugin's own stdlib checker. Gating.
[testenv:hub-agnostic]
skip_install = true
commands =
    python {toxinidir}/tools/check_hub_agnostic.py --strict

# Security lint (medium severity and confidence and up).
[testenv:bandit]
skip_install = true
deps = bandit>=1.7
commands =
    bandit -r {toxinidir}/app -ll -ii
