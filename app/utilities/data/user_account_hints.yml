# user_account_hints.yml
#
# Contextual markers that disambiguate the `account_type` field of a
# user-account SCO when the AE-plan "Domain" column does not contain a real
# Active-Directory FQDN but a parenthetical OS / scope hint such as
# "(linux)", "(local)", or "(sql)".
#
# Each value is the STIX 2.1 user-account `account_type-ov` label that the
# extractor should emit when the hint is detected in the domain cell.
#
# Source citations:
#   * "unix" hints -------- /etc/passwd `account_type` field and the
#                           STIX 2.1 §6.2 `account_type-ov` enumeration
#                           ("unix") plus common Linux distribution names
#                           (https://www.kernel.org/doc/Documentation/admin-guide/distros.rst).
#   * "windows-local" ----- Microsoft "Local Users and Groups" doc; STIX
#                           `account_type-ov` value "windows-local".
#                           "workgroup" from Microsoft Windows networking
#                           terminology (peer-to-peer non-domain network).
#   * "unix-sql" ---------- STIX `account_type-ov` is open vocab; the
#                           `unix-sql` extension is established usage in
#                           Microsoft SQL Server / MSSQL on Linux docs.
#                           https://learn.microsoft.com/en-us/sql/linux/

account_type_hints:
  unix:
    - linux
    - unix
    - (linux)
    - ubuntu
    - debian
    - rhel
    - centos
    - freebsd
  windows-local:
    - local
    - (local)
    - workgroup
    - "-"
  unix-sql:
    - sql
    - (sql)
    - mssql
    - sqlserver
    - "ms-sql"
