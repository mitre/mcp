# file_extensions.yml
#
# Augmentation list for `mimetypes`-derived file extension tokens used by
# the CTI hostname extractor to reject extensions surfaced as hostname
# candidates (e.g. someone writes "powershell.ps1" mid-sentence and our
# regex pulls "ps1" out).
#
# Each entry here is an extension that the Python stdlib `mimetypes`
# module does NOT list on stock Debian / Ubuntu distros (verified with
# `python3 -c "import mimetypes; print(mimetypes.types_map.get('.ps1'))"`
# returning None) but that is widely associated with files in CTI prose.
#
# Source citations:
#   * Microsoft PowerShell ----- learn.microsoft.com/en-us/powershell/
#                                scripting/lang-spec/chapter-01 (.ps1, .psm1, .psd1, .ps1xml)
#   * Windows shell scripting -- Microsoft Win32 batch-file documentation
#                                (.bat, .cmd)
#   * Unix shell scripting ----- POSIX.1-2017 Shell and Utilities (.sh)
#   * YAML 1.2 spec ------------ yaml.org spec (.yml, .yaml -- mimetypes
#                                provides .yaml on some distros but not .yml)
#   * Generic configuration ---- common-practice file-suffix conventions
#                                (.conf, .cfg, .ini -- mimetypes coverage
#                                is inconsistent across Python versions)
#   * Archive / package -------- .iso, .rpm, .deb, .msi often missing
#                                from stock `mimetypes.types_map`.
#
# NOT a hostname denylist. This file solely fills gaps in stdlib
# `mimetypes` so the hostname extractor can recognise common file
# extensions and reject them as identifier candidates.

extensions:
  # PowerShell
  - ps1
  - psm1
  - psd1
  - ps1xml
  # Windows shell
  - bat
  - cmd
  # Unix shell
  - sh
  - bash
  - zsh
  # YAML
  - yml
  # Configuration
  - conf
  - cfg
  - ini
  - toml
  # Archive / package
  - iso
  - rpm
  - deb
  - msi
  # Logs / dumps
  - log
  - dmp
  # Documents that mimetypes can miss on minimal distros
  - md
  - rst
