---
# LLM provider used by DSPy signatures, the ReAct loop, and embeddings.
# Values shipped here are non-secret defaults. The api_key is supplied at
# runtime via the env var named in api_key_env (set in plugins/mcp/.env)
# or per-session through the UI's Global Model Configuration.
#
# api_base ships empty so no deployment's gateway hostname is baked into
# the repo. Point it at your OpenAI-compatible endpoint via the env var
# named in api_base_env. Leaving it unresolved is fatal by design:
# LiteLLM would otherwise fall back to its built-in
# https://api.openai.com/v1 and quietly send prompts to a provider the
# deployment never chose.
#
# To pin values on disk instead, set them in conf/local.yml. That file is
# overlaid onto this one key by key, so it only needs the keys it changes.
#
# fields_locked declares which fields the deployment fixes. Locked fields
# ignore UI overrides and are refused by the set_config endpoint. It is not
# settable over the API, by design: a writable lock unlocks itself.
llm:
  # Declared here rather than only on cti so every profile that layers over
  # this one inherits it. LLMClient.generate reads it with no default.
  provider: openai_compatible
  model: openai/gpt-oss-120b
  api_base: ""
  api_base_env: MCP_LLM_API_BASE
  api_key_env: MCP_LLM_API_KEY
  ssl_verify: true
  offline: true
  fields_locked:
    model: false
    api_base: false

# Raw CTI -> IR/STIX extraction. This block LAYERS OVER llm: the endpoint,
# credentials and model are inherited, so they are configured once. Only the
# generation settings extraction genuinely needs differently live here.
#
# Extraction emits structured JSON that the rest of Stage 1 parses, so it wants
# temperature 0 where the planner and chat profile want sampling. That is the
# only real difference between the two workloads.
#
# The connection cannot be changed here. provider, model, api_base, the
# credentials and ssl_verify belong to `llm` alone, and this block may set only
# generation settings: temperature, top_p, max_tokens, timeout, stream, offline
# and embed_model. Anything else is dropped and logged, because extraction
# quietly running against a different endpoint from everything else is the
# failure this split exists to prevent.
cti:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4000
  timeout: 120
  # Offline stays per profile: extraction can be taken offline without
  # also silencing the planner and chat.
  offline: true

# Caldera REST API used by the caldera_core MCP subprocess. The url and key
# auto-resolve from caldera's own main config, so a stock deployment needs no
# setup. This block only names the env vars that override that; their values
# live in plugins/mcp/.env.
caldera:
  url_env: CALDERA_URL
  api_key_env: CORE_CALDERA_API_KEY

# MLflow tracking server. Defaults to localhost:5000 (MLflow's own default).
# Override in conf/local.yml when this Caldera tree shares a host with
# another Caldera tree whose MCP plugin is already bound to 5000 — set
# `port: 5050` (or any free port) so the two trees keep separate
# tracking stores instead of cross-contaminating runs.
mlflow:
  host: 127.0.0.1
  port: 5000
