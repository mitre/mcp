---
# MCP configuration. conf/local.yml is overlaid on this file key by key, so it
# needs only the keys it changes. Credentials never live in either file: they
# come from the env vars named below, set in plugins/mcp/.env.

# The connection. Chat, planning and CTI extraction all share it.
#
# api_base ships empty so no deployment's gateway is baked into the repo. Set
# MCP_LLM_API_BASE instead. Building an LM without one is refused rather than
# defaulted: LiteLLM would route to its built-in https://api.openai.com/v1 and
# send the prompt and the key to a provider this deployment never chose.
#
# fields_locked pins a field against UI edits and set_config refuses to write
# it. The lock itself is not settable over the API, because a writable lock
# unlocks itself.
llm:
  provider: openai_compatible
  model: openai/gpt-oss-120b
  api_base: ""
  api_base_env: MCP_LLM_API_BASE
  api_key_env: MCP_LLM_API_KEY
  ssl_verify: true
  offline: true
  # Shared by chat, planning and extraction. Set here rather than per profile
  # so the two panels that show them cannot display different numbers.
  # temperature 0 because Stage 1 parses the model's own output as JSON.
  temperature: 0.0
  max_tokens: 24000
  fields_locked:
    model: false
    api_base: false

# Raw CTI to IR and STIX. Layers over llm and may set only top_p, timeout,
# stream, offline and embed_model. The connection, temperature and max_tokens
# belong to llm alone, and anything else here is dropped and logged.
#
# timeout is longer than an interactive turn because a report is a long
# document. offline is per profile so extraction can be taken offline without
# silencing chat and planning.
cti:
  top_p: 1.0
  timeout: 120
  offline: true

# Caldera's REST API, used by the caldera_core subprocess. Both values
# auto-resolve from caldera's own config, so a stock deployment needs no setup;
# these only name the env vars that override it.
caldera:
  url_env: CALDERA_URL
  api_key_env: CORE_CALDERA_API_KEY

# MLflow tracking. Override the port when two Caldera trees share a host, so
# each keeps its own tracking store instead of cross-contaminating runs.
mlflow:
  host: 127.0.0.1
  port: 5000
